name: Docs checks

# CLAUDE.md and AGENTS.md are the auto-injected briefs for Claude Code and
# Codex. Both are generated from docs/assistant-brief.md so an instruction
# cannot reach one assistant and not the other. This check fails when the
# generated files are out of date with that source.

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'docs/assistant-brief.md'
      - 'scripts/build-agent-docs.mjs'
      - '.github/workflows/ci-docs.yaml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'docs/assistant-brief.md'
      - 'scripts/build-agent-docs.mjs'
      - '.github/workflows/ci-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-docs-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      # The generator is dependency-free, so no install step is needed.
      - name: Check CLAUDE.md and AGENTS.md are up to date
        run: node scripts/build-agent-docs.mjs --check
